<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wire — Graph Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:            #07090f;
  --surface:       #0f1623;
  --surface-2:     #172035;
  --border:        #1e2d47;
  --border-dim:    rgba(30,45,71,0.55);
  --text:          #d8e4f4;
  --muted:         #5a7396;
  --person:        #4a9edd;
  --org:           #e8a43a;
  --role:          #a78bfa;
  --game:          #34d399;
  --amber:         #e8a020;
  --amber-dim:     rgba(232,160,32,0.10);
  --amber-border:  rgba(232,160,32,0.30);
  --red:           #f87171;
  --red-dim:       rgba(248,113,113,0.08);
  --red-border:    rgba(248,113,113,0.28);
  --accent:        #5b9cf6;
  --accent-dim:    rgba(91,156,246,0.10);
  --accent-border: rgba(91,156,246,0.28);
  --green:         #34d399;
  --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  --head: 'Space Grotesk', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--head);
  overflow: hidden;
}

/* ── Layout ─────────────────────────────────────────────────────────── */

.shell {
  display: grid;
  grid-template-rows: 48px 1fr auto;
  grid-template-columns: 236px 1fr;
  grid-template-areas:
    "header header"
    "side   canvas"
    "cypher cypher";
  height: 100vh;
}

/* ── Header ─────────────────────────────────────────────────────────── */

.header {
  grid-area: header;
  display: flex;
  align-items: center;
  gap: 0.9em;
  padding: 0 1.1em;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.header-title {
  font-size: 0.82em;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--text);
  white-space: nowrap;
}

.header-title em {
  font-style: italic;
  color: var(--amber);
}

.header-stats {
  display: flex;
  align-items: center;
  gap: 1em;
  margin-left: 0.6em;
}

.hstat {
  font-size: 0.6em;
  font-family: var(--mono);
  color: var(--muted);
}

.hstat b { color: var(--text); font-weight: 600; }
.hstat.gold b { color: var(--amber); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 0.5em;
  margin-left: auto;
}

.btn-icon {
  background: none;
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--muted);
  font-size: 0.6em;
  font-family: var(--mono);
  padding: 0.35em 0.75em;
  cursor: pointer;
  transition: color 0.12s, border-color 0.12s, background 0.12s;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.btn-icon:hover { color: var(--text); border-color: var(--muted); }

.btn-icon.active {
  color: var(--accent);
  border-color: var(--accent-border);
  background: var(--accent-dim);
}

/* ── Sidebar ─────────────────────────────────────────────────────────── */

.sidebar {
  grid-area: side;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
}

.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sb-section {
  padding: 0.75em 0.9em;
  border-bottom: 1px solid var(--border-dim);
  flex-shrink: 0;
}

.ctrl-label {
  display: block;
  font-size: 0.55em;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--muted);
  margin-bottom: 0.6em;
}

/* Season strip */
.season-strip {
  display: flex;
  gap: 4px;
}

.s-btn {
  flex: 1;
  background: var(--surface-2);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 5px 0;
  font-size: 0.62em;
  font-family: var(--mono);
  cursor: pointer;
  text-align: center;
  transition: all 0.12s;
  font-weight: 500;
}

.s-btn:hover { color: var(--accent); border-color: var(--accent-border); background: var(--accent-dim); }
.s-btn.active { color: var(--accent); border-color: var(--accent-border); background: var(--accent-dim); font-weight: 700; }

/* Toggles */
.toggle-row {
  display: flex;
  flex-direction: column;
  gap: 0.2em;
}

.toggle {
  display: flex;
  align-items: center;
  gap: 0.5em;
  cursor: pointer;
  font-size: 0.68em;
  color: var(--muted);
  padding: 0.22em 0;
  user-select: none;
  transition: color 0.12s;
}

.toggle:hover { color: var(--text); }

.toggle input {
  accent-color: var(--accent);
  width: 12px;
  height: 12px;
  cursor: pointer;
  flex-shrink: 0;
}

/* Legend */
.legend {
  display: flex;
  flex-direction: column;
  gap: 0.38em;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 0.55em;
  font-size: 0.66em;
  color: var(--muted);
}

.ldot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

.ldot.person       { background: var(--person); box-shadow: 0 0 5px var(--person); }
.ldot.organisation { background: var(--org);    box-shadow: 0 0 5px var(--org); }
.ldot.role         { background: var(--role);   box-shadow: 0 0 5px var(--role); }
.ldot.game         { background: var(--game);   box-shadow: 0 0 5px var(--game); }

.ldash {
  width: 18px; height: 0;
  border-top: 2px dashed var(--amber);
  flex-shrink: 0;
  margin: 4px 0;
}

/* Info panel */
.info-panel { display: none; }
.info-panel.visible { display: block; }

.info-name {
  font-size: 0.88em;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.015em;
  margin-bottom: 0.1em;
}

.info-type-badge {
  display: inline-block;
  font-size: 0.52em;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  padding: 0.15em 0.55em;
  border-radius: 3px;
  margin-bottom: 0.6em;
}

.info-type-badge.Person       { background: rgba(74,158,221,0.15); color: var(--person); border: 1px solid rgba(74,158,221,0.3); }
.info-type-badge.Organisation { background: rgba(232,164,58,0.12); color: var(--org);    border: 1px solid rgba(232,164,58,0.3); }
.info-type-badge.Role         { background: rgba(167,139,250,0.12); color: var(--role);  border: 1px solid rgba(167,139,250,0.3); }
.info-type-badge.Game         { background: rgba(52,211,153,0.10); color: var(--game);   border: 1px solid rgba(52,211,153,0.25); }

.info-connections {
  font-size: 0.63em;
  color: var(--muted);
  line-height: 1.8;
  margin-bottom: 0.6em;
}

.info-connections strong { color: var(--text); font-weight: 500; }
.info-connections .inh-tag { color: var(--amber); }

.info-actions {
  display: flex;
  flex-direction: column;
  gap: 0.35em;
}

.btn-sm {
  border-radius: 5px;
  padding: 0.38em 0.7em;
  font-size: 0.63em;
  font-family: var(--head);
  cursor: pointer;
  border: 1px solid;
  text-align: left;
  transition: background 0.12s;
  font-weight: 500;
}

.btn-remove  { background: var(--red-dim);   color: var(--red);    border-color: var(--red-border); display: none; }
.btn-restore { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-border); display: none; }
.btn-remove:hover  { background: rgba(248,113,113,0.16); }
.btn-restore:hover { background: rgba(91,156,246,0.18); }

/* Succession panel */
.succession-panel { display: none; }
.succession-panel.visible { display: block; }

.succ-event {
  background: var(--amber-dim);
  border: 1px solid var(--amber-border);
  border-radius: 6px;
  padding: 0.5em 0.7em;
  margin-bottom: 0.38em;
  font-size: 0.62em;
  line-height: 1.5;
}

.succ-event:last-child { margin-bottom: 0; }
.succ-note { display: block; color: var(--amber); font-weight: 600; margin-bottom: 0.12em; }
.succ-from { color: rgba(232,160,32,0.6); font-family: var(--mono); font-size: 0.88em; }

/* Removed panel */
.removed-panel { display: none; }
.removed-panel.visible { display: block; }

.removed-tag {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--red-dim);
  border: 1px solid var(--red-border);
  border-radius: 4px;
  padding: 0.28em 0.45em 0.28em 0.65em;
  font-size: 0.63em;
  color: var(--red);
  margin-bottom: 0.3em;
}

.removed-tag:last-child { margin-bottom: 0; }

.removed-tag button {
  background: none;
  border: none;
  color: var(--red);
  cursor: pointer;
  font-size: 1.1em;
  opacity: 0.5;
  transition: opacity 0.12s;
  padding: 0 0.2em;
  font-family: var(--head);
  line-height: 1;
}

.removed-tag button:hover { opacity: 1; }

/* ── Observation overlay ─────────────────────────────────────────────── */

#observation {
  position: absolute;
  top: 46%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  z-index: 20;
  opacity: 0;
  transition: opacity 0.38s ease;
  padding: 1.2em 2em;
  max-width: 520px;
  width: max-content;
}

.obs-main {
  display: block;
  font-size: 2em;
  font-weight: 700;
  font-family: var(--head);
  color: var(--amber);
  letter-spacing: -0.025em;
  line-height: 1.18;
  text-shadow: 0 0 60px rgba(232,160,32,0.6), 0 2px 12px rgba(0,0,0,0.95);
}

.obs-sub {
  display: block;
  font-size: 0.82em;
  font-family: var(--head);
  color: rgba(216,228,244,0.6);
  margin-top: 0.4em;
  font-style: italic;
  text-shadow: 0 1px 6px rgba(0,0,0,0.95);
  letter-spacing: 0.01em;
}

/* ── Canvas ──────────────────────────────────────────────────────────── */

.canvas-wrap {
  grid-area: canvas;
  position: relative;
  overflow: hidden;
  background: #06080e;
  background-image:
    radial-gradient(ellipse at 18% 22%, rgba(74,158,221,0.05) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 75%, rgba(167,139,250,0.04) 0%, transparent 50%);
}

#cy { width: 100%; height: 100%; }

#graph-tooltip {
  position: absolute;
  pointer-events: none;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 0.35em 0.7em;
  font-size: 0.7em;
  font-family: var(--mono);
  color: var(--text);
  opacity: 0;
  transition: opacity 0.1s;
  z-index: 10;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,0.55);
}

/* ── Cypher panel ────────────────────────────────────────────────────── */

.cypher-panel {
  grid-area: cypher;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: height 0.22s ease;
  overflow: hidden;
}

.cypher-panel.collapsed { height: 36px; }
.cypher-panel.expanded  { height: 175px; }

.cypher-header {
  display: flex;
  align-items: center;
  gap: 0.7em;
  padding: 0 0.9em;
  height: 36px;
  flex-shrink: 0;
  cursor: pointer;
  user-select: none;
}

.cypher-header:hover .cypher-label { color: var(--text); }

.cypher-label {
  font-size: 0.55em;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--muted);
  transition: color 0.12s;
}

.cypher-badge {
  font-size: 0.48em;
  font-family: var(--mono);
  background: rgba(91,156,246,0.10);
  color: var(--accent);
  border: 1px solid var(--accent-border);
  border-radius: 3px;
  padding: 0.1em 0.5em;
  letter-spacing: 0.06em;
}

.cypher-chevron {
  margin-left: auto;
  font-size: 0.7em;
  color: var(--muted);
  transition: transform 0.22s ease;
}

.cypher-panel.collapsed .cypher-chevron { transform: rotate(0deg); }
.cypher-panel.expanded  .cypher-chevron { transform: rotate(180deg); }

.cypher-copy {
  margin-left: 0.3em;
  background: none;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--muted);
  font-size: 0.52em;
  font-family: var(--mono);
  padding: 0.2em 0.6em;
  cursor: pointer;
  transition: color 0.12s, border-color 0.12s;
  letter-spacing: 0.04em;
  display: none;
}

.cypher-copy:hover { color: var(--text); border-color: var(--muted); }
.cypher-panel.expanded .cypher-copy { display: inline; }

.cypher-body {
  flex: 1;
  overflow: auto;
  padding: 0 0.9em 0.75em;
  font-family: var(--mono);
  font-size: 0.65em;
  line-height: 1.7;
  color: var(--muted);
}

.cypher-body::-webkit-scrollbar { height: 4px; width: 4px; }
.cypher-body::-webkit-scrollbar-track { background: transparent; }
.cypher-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Cypher syntax colours */
.kw  { color: #7dd3fc; }
.fn  { color: var(--accent); }
.str { color: #a5f3b8; }
.num { color: var(--amber); }
.cmt { color: var(--muted); font-style: italic; opacity: 0.75; }
.var { color: #c4b5fd; }
.rel { color: var(--amber); }
.prop{ color: #94a3b8; }
</style>
</head>
<body>

<div class="shell">

  <!-- ── Header ─────────────────────────────────────────────────────── -->
  <header class="header">
    <span class="header-title">Putting <em>The Wire</em> on the Graph</span>
    <div class="header-stats">
      <span class="hstat">Season <b id="st-season">1</b></span>
      <span class="hstat">Nodes <b id="st-nodes">—</b></span>
      <span class="hstat">Active edges <b id="st-edges">—</b></span>
      <span class="hstat gold" id="st-inh-wrap" style="display:none">Inherited <b id="st-inh">0</b></span>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="btn-layout" title="Re-run layout">Relayout</button>
      <button class="btn-icon" id="btn-fit"    title="Fit to screen">Fit</button>
      <button class="btn-icon" id="btn-reset"  title="Reset all">Reset</button>
    </div>
  </header>

  <!-- ── Sidebar ────────────────────────────────────────────────────── -->
  <aside class="sidebar">

    <div class="sb-section">
      <span class="ctrl-label">Season</span>
      <div class="season-strip">
        <button class="s-btn active" data-season="1">S1</button>
        <button class="s-btn"        data-season="2">S2</button>
        <button class="s-btn"        data-season="3">S3</button>
        <button class="s-btn"        data-season="4">S4</button>
        <button class="s-btn"        data-season="5">S5</button>
      </div>
    </div>

    <div class="sb-section">
      <span class="ctrl-label">Overlay</span>
      <div class="toggle-row">
        <label class="toggle"><input type="checkbox" id="show-roles"> Roles</label>
        <label class="toggle"><input type="checkbox" id="show-games"> Games</label>
        <label class="toggle"><input type="checkbox" id="fade-inactive" checked> Fade inactive edges</label>
        <label class="toggle"><input type="checkbox" id="size-by-degree" checked> Size nodes by degree</label>
      </div>
    </div>

    <!-- Node info -->
    <div class="sb-section info-panel" id="info-panel">
      <div class="info-name" id="info-name"></div>
      <div class="info-type-badge" id="info-type-badge"></div>
      <div class="info-connections" id="info-connections"></div>
      <div class="info-actions">
        <button class="btn-sm btn-restore" id="restore-btn">↩ Restore this node</button>
        <button class="btn-sm btn-remove"  id="remove-btn">✕ Remove this node</button>
      </div>
    </div>

    <!-- Succession events -->
    <div class="sb-section succession-panel" id="succession-panel">
      <span class="ctrl-label">Graph rewrite</span>
      <div id="succession-events"></div>
    </div>

    <!-- Removed nodes -->
    <div class="sb-section removed-panel" id="removed-panel">
      <span class="ctrl-label">Removed</span>
      <div id="removed-tags"></div>
    </div>

    <!-- Legend -->
    <div class="sb-section" style="margin-top:auto">
      <span class="ctrl-label">Legend</span>
      <div class="legend">
        <div class="legend-row"><span class="ldot person"></span>Person</div>
        <div class="legend-row"><span class="ldot organisation"></span>Organisation</div>
        <div class="legend-row"><span class="ldot role"></span>Role</div>
        <div class="legend-row"><span class="ldot game"></span>The Game</div>
        <div class="legend-row" style="margin-top:0.35em"><span class="ldash"></span>Inherited edge</div>
      </div>
    </div>

  </aside>

  <!-- ── Canvas ─────────────────────────────────────────────────────── -->
  <div class="canvas-wrap">
    <div id="cy"></div>
    <div id="graph-tooltip"></div>
    <div id="observation"></div>
  </div>

  <!-- ── Cypher panel ───────────────────────────────────────────────── -->
  <div class="cypher-panel expanded" id="cypher-panel">
    <div class="cypher-header" id="cypher-toggle">
      <span class="cypher-label">Neo4j · Cypher Query</span>
      <span class="cypher-badge">live</span>
      <button class="cypher-copy" id="cypher-copy">Copy</button>
      <span class="cypher-chevron">▲</span>
    </div>
    <div class="cypher-body" id="cypher-body"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.29.2/cytoscape.min.js"></script>
<script>
/* ── State ──────────────────────────────────────────────────────────── */

let cy           = null;
let graphData    = null;
let season       = 1;
let removed      = new Set();
let selectedId   = null;
let showRoles    = false;
let showGames    = false;
let fadeInactive = true;
let sizeByDegree = true;
let inheritedMap = new Map(); // edgeId → {from_node, note}
let prevInhIds   = new Set();

/* ── Observations ────────────────────────────────────────────────────── */

const OBSERVATIONS = {
  season: {
    2: { main: "Stringer takes the wheel.",        sub: null },
    3: { main: "Two orgs. One territory.",         sub: "The game gets crowded." },
    4: { main: "The game moves to the schools.",   sub: null },
    5: { main: "The game moves to the newsroom.",  sub: null },
  },
  remove: {
    avon_barksdale: [
      { seasons: [1,2,3], main: "Stringer gets the bump.",               sub: "The game carries on." },
      { seasons: [4,5],   main: "He was already gone.",                  sub: null },
    ],
    stringer_bell: [
      { seasons: [1,2,3], main: "Avon takes it back.",                   sub: "Not for long." },
      { seasons: [4,5],   main: "Already dead by now.",                  sub: null },
    ],
    jimmy_mcnulty: [
      { seasons: [1,2,3,4,5], main: "The investigation loses its engine.", sub: "The institution carries on." },
    ],
    omar_little: [
      { seasons: [1,2,3,4], main: "The role sits empty.",               sub: "Briefly." },
      { seasons: [5],       main: "The role sits empty.",               sub: null },
    ],
    prop_joe: [
      { seasons: [1,2,3,4], main: "Marlo seizes the Co-Op.",            sub: "The east side consolidates." },
      { seasons: [5],       main: "Already dead by now.",               sub: null },
    ],
    marlo_stanfield: [
      { seasons: [1,2],   main: "Not in play yet.",                     sub: null },
      { seasons: [3,4,5], main: "Someone takes the corners.",           sub: "The game carries on." },
    ],
    clay_davis: [
      { seasons: [1,2,3,4,5], main: "The money still moves.",           sub: "Just differently." },
    ],
    namond_brice: [
      { seasons: [1,2,3,4,5], main: "He might be one of the few.",      sub: "He stops playing it." },
    ],
    lester_freamon: [
      { seasons: [1,2,3,4,5], main: "The best detective they have.",    sub: "And they keep trying to lose him." },
    ],
    cedric_daniels: [
      { seasons: [1,2,3,4,5], main: "The institution eats its best.",   sub: null },
    ],
  },
  restore: {
    avon_barksdale:  "Avon's back in play.",
    stringer_bell:   "Stringer's back.",
    jimmy_mcnulty:   "McNulty's back.",
    omar_little:     "Omar's back.",
    prop_joe:        "Prop Joe's back.",
    marlo_stanfield: "Marlo's back.",
  },
};

let obsTimer = null;

function flashObservation(main, sub) {
  const el = document.getElementById('observation');
  if (!el) return;
  if (obsTimer) clearTimeout(obsTimer);
  el.innerHTML = `<span class="obs-main">${main}</span>${sub ? `<span class="obs-sub">${sub}</span>` : ''}`;
  el.style.opacity = '1';
  obsTimer = setTimeout(() => { el.style.opacity = '0'; obsTimer = null; }, 2800);
}

function getRemoveObs(id) {
  const entries = OBSERVATIONS.remove[id];
  if (!entries) return null;
  return entries.find(e => e.seasons.includes(season)) || null;
}

/* ── Palette ─────────────────────────────────────────────────────────── */

const NODE_COLORS = {

/* ── Succession logic ────────────────────────────────────────────────── */

function visibleIds() {
  const ids = new Set();
  graphData.nodes.forEach(n => {
    if (removed.has(n.id))            return;
    if (!showRoles && n.type === 'Role') return;
    if (!showGames && n.type === 'Game') return;
    ids.add(n.id);
  });
  return ids;
}

function activeEdgeIds(s) {
  const ids = new Set();
  graphData.edges.forEach(e => {
    if (s >= e.season_start && s <= e.season_end) ids.add(e.id);
  });
  return ids;
}

function computeInherited() {
  const result = [];
  if (!graphData.succession) return result;

  graphData.succession.forEach(entry => {
    if (!removed.has(entry.when_removed)) return;

    entry.rules.forEach(rule => {
      const ns = rule.new_source;
      if (removed.has(ns)) return;

      const tgt = graphData.nodes.find(n => n.id === rule.target);
      if (!tgt) return;
      if (!showRoles && tgt.type === 'Role') return;
      if (!showGames && tgt.type === 'Game') return;

      // Skip if a seasonal edge already satisfies the rule
      const exists = graphData.edges.some(e =>
        e.source === ns && e.target === rule.target &&
        e.label  === rule.label &&
        season >= e.season_start && season <= e.season_end
      );
      if (exists) return;

      result.push({
        id:        `inh__${entry.when_removed}__${ns}__${rule.label}__${rule.target}`,
        source:    ns,
        target:    rule.target,
        label:     rule.label,
        from_node: entry.when_removed,
        note:      entry.note,
      });
    });
  });

  return result;
}

function syncInherited() {
  const desired    = computeInherited();
  const desiredIds = new Set(desired.map(e => e.id));
  const newIds     = new Set([...desiredIds].filter(id => !prevInhIds.has(id)));

  for (const id of inheritedMap.keys()) {
    if (!desiredIds.has(id)) { cy.getElementById(id).remove(); inheritedMap.delete(id); }
  }

  desired.forEach(spec => {
    if (inheritedMap.has(spec.id)) return;
    const src = cy.getElementById(spec.source);
    const tgt = cy.getElementById(spec.target);
    if (!src.length || !tgt.length) return;

    cy.add({
      group: 'edges',
      data: { id: spec.id, source: spec.source, target: spec.target, label: spec.label },
      classes: 'inherited',
    });

    inheritedMap.set(spec.id, { from_node: spec.from_node, note: spec.note });

    // Flash new inherited edges
    if (newIds.has(spec.id)) {
      const edge = cy.getElementById(spec.id);
      setTimeout(() => flashEdge(edge), 300);
      pulseNode(cy.getElementById(spec.source));
      pulseNode(cy.getElementById(spec.target));
    }
  });

  prevInhIds = new Set(desiredIds);
  renderSuccessionPanel();
  updateInheritedStat();
}

/* ── Animations ──────────────────────────────────────────────────────── */

function pulseNode(node, color = '#e8a020') {
  if (!node || !node.length) return;
  node.stop(true, false);
  node.animate(
    { style: { 'border-width': 7, 'border-color': color, 'border-opacity': 1 } },
    { duration: 220, easing: 'ease-out',
      complete() {
        node.animate(
          { style: { 'border-width': 2, 'border-color': 'rgba(255,255,255,0.10)', 'border-opacity': 1 } },
          { duration: 600, easing: 'ease-in-out' }
        );
      }
    }
  );
}

function flashEdge(edge) {
  if (!edge || !edge.length) return;
  edge.stop(true, false);
  edge.animate({ style: { width: 5 } },
    { duration: 160, easing: 'ease-out',
      complete() { edge.animate({ style: { width: 2.5 } }, { duration: 400 }); }
    }
  );
}

/* ── Degree-based node sizing ────────────────────────────────────────── */

function updateNodeSizes(visible, active) {
  if (!sizeByDegree) {
    cy.nodes().forEach(n => n.stop(true).animate({ style: { width: 46, height: 46 } }, { duration: 200 }));
    return;
  }

  const deg = new Map();
  cy.nodes().forEach(n => deg.set(n.id(), 0));

  cy.edges().forEach(e => {
    if (!active.has(e.id()) && !e.hasClass('inherited')) return;
    const sv = visible.has(e.source().id());
    const tv = visible.has(e.target().id());
    if (!sv || !tv) return;
    deg.set(e.source().id(), (deg.get(e.source().id()) || 0) + 1);
    deg.set(e.target().id(), (deg.get(e.target().id()) || 0) + 1);
  });

  const maxD = Math.max(...deg.values(), 1);

  cy.nodes().forEach(n => {
    const d    = deg.get(n.id()) || 0;
    const t    = n.data('type');
    const base = t === 'Organisation' ? 1 : t === 'Role' ? 0.9 : 1;
    const size = Math.round((34 + (d / maxD) * 22) * base);
    n.stop(true, false).animate({ style: { width: size, height: size } }, { duration: 240 });
  });
}

/* ── Main graph update ───────────────────────────────────────────────── */

function updateGraph(animated = true) {
  if (!cy) return;

  const visible = visibleIds();
  const active  = activeEdgeIds(season);
  const dur     = animated ? 260 : 0;

  cy.nodes().forEach(node => {
    const show = visible.has(node.id());
    if (animated) {
      node.stop(true, false).animate(
        { style: { opacity: show ? 1 : 0 } },
        { duration: dur, easing: 'ease-in-out',
          complete() { if (!show) node.style('display', 'none'); }
        }
      );
      if (show) node.style('display', 'element');
    } else {
      node.style({ display: show ? 'element' : 'none', opacity: show ? 1 : 0 });
    }
  });

  cy.edges().forEach(edge => {
    if (edge.hasClass('inherited')) return;
    const sv = visible.has(edge.source().id());
    const tv = visible.has(edge.target().id());
    if (!sv || !tv) { edge.style({ display: fadeInactive ? 'element' : 'none', opacity: 0 }); return; }

    const isActive = active.has(edge.id());
    edge.style('display', fadeInactive || isActive ? 'element' : 'none');

    const targetOp = isActive ? 0.88 : (fadeInactive ? 0.06 : 0);
    if (animated) {
      edge.stop(true, false).animate({ style: { opacity: targetOp } }, { duration: dur });
    } else {
      edge.style('opacity', targetOp);
    }
    edge.style('font-size', isActive ? 7.5 : 0);
  });

  syncInherited();
  updateNodeSizes(visible, active);
  updateStatus(visible, active);
  updateCypher();
  if (selectedId) refreshInfoPanel();
}

/* ── Selection ───────────────────────────────────────────────────────── */

function selectNode(id) {
  selectedId = id;
  cy.elements().removeClass('selected dimmed highlighted neighbour');
  const node = cy.getElementById(id);
  const hood = node.closedNeighborhood();
  cy.elements().not(hood).addClass('dimmed');
  hood.edges().addClass('highlighted');
  hood.nodes().not(node).addClass('neighbour');
  node.addClass('selected');
  renderInfoPanel(id);
}

function clearSelection() {
  selectedId = null;
  cy.elements().removeClass('selected dimmed highlighted neighbour');
  document.getElementById('info-panel').classList.remove('visible');
}

function refreshInfoPanel() {
  if (selectedId) renderInfoPanel(selectedId);
}

function renderInfoPanel(id) {
  const nd     = graphData.nodes.find(n => n.id === id);
  if (!nd) return;

  const active = activeEdgeIds(season);

  const connEdges = graphData.edges.filter(e =>
    (e.source === id || e.target === id) && active.has(e.id)
  );

  const inhConn = [...inheritedMap.keys()].filter(eid => {
    const el = cy.getElementById(eid);
    return el.length && (el.data('source') === id || el.data('target') === id);
  });

  const lines = connEdges.map(e => {
    const oid   = e.source === id ? e.target : e.source;
    const other = graphData.nodes.find(n => n.id === oid);
    return `<strong>${other ? other.label : oid}</strong> <span style="opacity:.6;font-size:.9em">${e.label}</span>`;
  });

  inhConn.forEach(eid => {
    const el    = cy.getElementById(eid);
    const oid   = el.data('source') === id ? el.data('target') : el.data('source');
    const other = graphData.nodes.find(n => n.id === oid);
    lines.push(`<strong>${other ? other.label : oid}</strong> <span class="inh-tag" style="font-size:.9em">${el.data('label')} ★ inherited</span>`);
  });

  document.getElementById('info-name').textContent        = nd.label.replace('\n', ' ');
  const badge = document.getElementById('info-type-badge');
  badge.textContent  = nd.type;
  badge.className    = `info-type-badge ${nd.type}`;
  document.getElementById('info-connections').innerHTML    =
    lines.length ? lines.join('<br>') : 'No active connections this season.';

  const isRem = removed.has(id);
  document.getElementById('remove-btn').style.display   = isRem ? 'none'  : 'block';
  document.getElementById('restore-btn').style.display  = isRem ? 'block' : 'none';
  document.getElementById('info-panel').classList.add('visible');
}

/* ── Remove / restore ────────────────────────────────────────────────── */

function removeNode(id) {
  removed.add(id);
  updateGraph(true);
  renderRemovedPanel();
  clearSelection();
  const obs = getRemoveObs(id);
  if (obs) setTimeout(() => flashObservation(obs.main, obs.sub), 420);
}

function restoreNode(id) {
  removed.delete(id);
  updateGraph(true);
  renderRemovedPanel();
  renderInfoPanel(id);
  const msg = OBSERVATIONS.restore?.[id];
  if (msg) setTimeout(() => flashObservation(msg, null), 320);
}

/* ── Succession panel ────────────────────────────────────────────────── */

function renderSuccessionPanel() {
  const panel  = document.getElementById('succession-panel');
  const events = document.getElementById('succession-events');

  if (inheritedMap.size === 0) { panel.classList.remove('visible'); return; }

  const seen = new Map();
  inheritedMap.forEach(({ from_node, note }) => {
    if (!seen.has(note)) {
      const n = graphData.nodes.find(x => x.id === from_node);
      seen.set(note, n ? n.label : from_node);
    }
  });

  events.innerHTML = '';
  seen.forEach((fromLabel, note) => {
    const div = document.createElement('div');
    div.className = 'succ-event';
    div.innerHTML = `<span class="succ-note">${note}</span><span class="succ-from">← ${fromLabel} removed</span>`;
    events.appendChild(div);
  });

  panel.classList.add('visible');
}

/* ── Removed panel ───────────────────────────────────────────────────── */

function renderRemovedPanel() {
  const panel = document.getElementById('removed-panel');
  const tags  = document.getElementById('removed-tags');
  if (removed.size === 0) { panel.classList.remove('visible'); return; }
  panel.classList.add('visible');
  tags.innerHTML = '';
  removed.forEach(id => {
    const n    = graphData.nodes.find(x => x.id === id);
    const name = n ? n.label.replace('\n', ' ') : id;
    const tag  = document.createElement('div');
    tag.className = 'removed-tag';
    tag.innerHTML = `<span>${name}</span><button title="Restore" onclick="restoreNode('${id}')">↩</button>`;
    tags.appendChild(tag);
  });
}

/* ── Status ──────────────────────────────────────────────────────────── */

function updateStatus(visible, active) {
  document.getElementById('st-season').textContent = season;
  document.getElementById('st-nodes').textContent  = visible.size;
  let ec = 0;
  cy.edges().forEach(e => {
    if (!e.hasClass('inherited') && e.style('display') !== 'none' && active.has(e.id())) ec++;
  });
  document.getElementById('st-edges').textContent = ec;
}

function updateInheritedStat() {
  const n    = inheritedMap.size;
  const wrap = document.getElementById('st-inh-wrap');
  wrap.style.display = n > 0 ? '' : 'none';
  document.getElementById('st-inh').textContent = n;
}

/* ── Cypher query generator ──────────────────────────────────────────── */

function buildCypherText() {
  const lines = [];

  lines.push(`<span class="kw">MATCH</span> <span class="var">(n)</span>-<span class="var">[r]</span>-&gt;<span class="var">(m)</span>`);
  lines.push(`<span class="kw">WHERE</span> <span class="var">r</span>.<span class="prop">season_start</span> &lt;= <span class="num">${season}</span>`);
  lines.push(`  <span class="kw">AND</span>   <span class="var">r</span>.<span class="prop">season_end</span>   &gt;= <span class="num">${season}</span>`);

  if (removed.size > 0) {
    const ids = [...removed].map(id => `<span class="str">'${id}'</span>`).join(', ');
    lines.push(`  <span class="kw">AND NOT</span> <span class="var">n</span>.<span class="prop">id</span> <span class="kw">IN</span> [${ids}]`);
    lines.push(`  <span class="kw">AND NOT</span> <span class="var">m</span>.<span class="prop">id</span> <span class="kw">IN</span> [${ids}]`);
  }

  if (!showRoles) {
    lines.push(`  <span class="kw">AND</span>   <span class="var">n</span>.<span class="prop">type</span> &lt;&gt; <span class="str">'Role'</span>`);
    lines.push(`  <span class="kw">AND</span>   <span class="var">m</span>.<span class="prop">type</span> &lt;&gt; <span class="str">'Role'</span>`);
  }

  if (!showGames) {
    lines.push(`  <span class="kw">AND</span>   <span class="var">n</span>.<span class="prop">type</span> &lt;&gt; <span class="str">'Game'</span>`);
    lines.push(`  <span class="kw">AND</span>   <span class="var">m</span>.<span class="prop">type</span> &lt;&gt; <span class="str">'Game'</span>`);
  }

  lines.push(`<span class="kw">RETURN</span> <span class="var">n</span>, <span class="var">r</span>, <span class="var">m</span>`);

  // Succession
  const inherited = computeInherited();
  if (inherited.length > 0) {
    lines.push('');
    lines.push(`<span class="cmt">// Succession — ${inherited.length} inherited edge${inherited.length > 1 ? 's' : ''}</span>`);
    inherited.forEach(e => {
      const src = graphData.nodes.find(n => n.id === e.source);
      const tgt = graphData.nodes.find(n => n.id === e.target);
      lines.push(`<span class="kw">MERGE</span> <span class="var">(${src ? src.label.replace('\n',' ') : e.source})</span>-[:<span class="rel">${e.label}</span> {<span class="prop">inherited</span>: <span class="kw">true</span>}]-&gt;<span class="var">(${tgt ? tgt.label.replace('\n',' ') : e.target})</span>`);
    });
    lines.push(`<span class="cmt">// Note: ${inherited[0].note}</span>`);
  }

  return lines.join('\n');
}

function buildCypherPlain() {
  const lines = [];
  lines.push(`MATCH (n)-[r]->(m)`);
  lines.push(`WHERE r.season_start <= ${season}`);
  lines.push(`  AND   r.season_end   >= ${season}`);
  if (removed.size > 0) {
    const ids = [...removed].map(id => `'${id}'`).join(', ');
    lines.push(`  AND NOT n.id IN [${ids}]`);
    lines.push(`  AND NOT m.id IN [${ids}]`);
  }
  if (!showRoles) { lines.push(`  AND   n.type <> 'Role'`); lines.push(`  AND   m.type <> 'Role'`); }
  if (!showGames) { lines.push(`  AND   n.type <> 'Game'`); lines.push(`  AND   m.type <> 'Game'`); }
  lines.push(`RETURN n, r, m`);
  const inherited = computeInherited();
  if (inherited.length > 0) {
    lines.push('');
    lines.push(`// Succession — ${inherited.length} inherited edge(s)`);
    inherited.forEach(e => {
      lines.push(`MERGE (${e.source})-[:${e.label} {inherited: true}]->(${e.target})`);
    });
    lines.push(`// Note: ${inherited[0].note}`);
  }
  return lines.join('\n');
}

function updateCypher() {
  const body = document.getElementById('cypher-body');
  if (!body) return;
  body.innerHTML = buildCypherText();
}

/* ── Reset ───────────────────────────────────────────────────────────── */

function resetAll() {
  removed.clear();
  season      = 1;
  showRoles   = false;
  showGames   = false;
  fadeInactive = true;
  sizeByDegree = true;
  document.querySelectorAll('.s-btn').forEach(b => b.classList.toggle('active', b.dataset.season === '1'));
  document.getElementById('show-roles').checked    = false;
  document.getElementById('show-games').checked    = false;
  document.getElementById('fade-inactive').checked = true;
  document.getElementById('size-by-degree').checked = true;
  clearSelection();
  renderRemovedPanel();
  renderSuccessionPanel();
  updateGraph(true);
}

/* ── Tooltip ─────────────────────────────────────────────────────────── */

function showTooltip(node, clientX, clientY) {
  const tt = document.getElementById('graph-tooltip');
  tt.textContent    = `${node.data('label').replace('\n', ' ')} [${node.data('type')}]`;
  tt.style.left     = (clientX + 14) + 'px';
  tt.style.top      = (clientY - 10) + 'px';
  tt.style.opacity  = '1';
}

function hideTooltip() {
  document.getElementById('graph-tooltip').style.opacity = '0';
}

/* ── Init ────────────────────────────────────────────────────────────── */

async function init() {
  const res  = await fetch('data/wire-graph.json');
  graphData  = await res.json();

  const nodes = graphData.nodes.map(n => ({
    data:     { id: n.id, label: n.label, type: n.type },
    position: { x: n.x, y: n.y },
  }));

  const edges = graphData.edges.map(e => ({
    data: { id: e.id, source: e.source, target: e.target, label: e.label,
            season_start: e.season_start, season_end: e.season_end },
  }));

  cy = cytoscape({
    container:           document.getElementById('cy'),
    elements:            { nodes, edges },
    style:               buildStyle(),
    layout:              { name: 'preset' },
    minZoom:             0.2,
    maxZoom:             3.5,
    userZoomingEnabled:  true,
    userPanningEnabled:  true,
    boxSelectionEnabled: false,
  });

  cy.fit(cy.nodes(), 55);

  cy.on('tap', 'node', evt => { hideTooltip(); selectNode(evt.target.id()); });
  cy.on('tap', evt  => { if (evt.target === cy) clearSelection(); });
  cy.on('mouseover', 'node', evt => {
    const pos = evt.originalEvent;
    showTooltip(evt.target, pos.clientX, pos.clientY);
  });
  cy.on('mouseout drag pan zoom', () => hideTooltip());

  bindControls();
  updateGraph(false);
}

function bindControls() {
  document.querySelectorAll('.s-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.s-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      season = +btn.dataset.season;
      updateGraph(true);
      const sObs = OBSERVATIONS.season[season];
      if (sObs) setTimeout(() => flashObservation(sObs.main, sObs.sub), 360);
    });
  });

  document.getElementById('show-roles').addEventListener('change',     e => { showRoles    = e.target.checked; updateGraph(true); });
  document.getElementById('show-games').addEventListener('change',     e => { showGames    = e.target.checked; updateGraph(true); });
  document.getElementById('fade-inactive').addEventListener('change',  e => { fadeInactive = e.target.checked; updateGraph(true); });
  document.getElementById('size-by-degree').addEventListener('change', e => { sizeByDegree = e.target.checked; updateGraph(true); });

  document.getElementById('remove-btn').addEventListener('click',  () => selectedId && removeNode(selectedId));
  document.getElementById('restore-btn').addEventListener('click', () => selectedId && restoreNode(selectedId));
  document.getElementById('btn-reset').addEventListener('click',   resetAll);

  document.getElementById('btn-fit').addEventListener('click', () => cy.fit(cy.nodes(':visible'), 50));

  document.getElementById('btn-layout').addEventListener('click', () => {
    cy.layout({
      name: 'cose',
      animate: true, animationDuration: 800,
      randomize: false,
      nodeRepulsion: 14000,
      idealEdgeLength: 140,
      gravity: 0.55,
      numIter: 700,
      padding: 50,
    }).run();
  });

  // Cypher toggle
  const panel   = document.getElementById('cypher-panel');
  const toggle  = document.getElementById('cypher-toggle');
  toggle.addEventListener('click', () => {
    panel.classList.toggle('collapsed');
    panel.classList.toggle('expanded');
  });

  document.getElementById('cypher-copy').addEventListener('click', e => {
    e.stopPropagation();
    navigator.clipboard.writeText(buildCypherPlain()).then(() => {
      const btn = document.getElementById('cypher-copy');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1600);
    });
  });
}

init();
</script>
</body>
</html>
